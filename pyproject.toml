[project]
name = "lidcheck"
version = "0.1.0"
description = "Browser pallor screening research benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "pillow>=11", "scipy>=1.14", "scikit-learn>=1.6", "matplotlib>=3.9", "openpyxl>=3.1", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lidcheck = "lidcheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
